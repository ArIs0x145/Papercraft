# Spring AI Configuration
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: gpt-4
          temperature: 0.7
          max-tokens: 2000

# Server Configuration
server:
  port: 8080

# Logging Configuration
logging:
  level:
    org.springframework.ai: DEBUG
    io.github.aris0x145.papercraft: DEBUG