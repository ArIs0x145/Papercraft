spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
          max-completion-tokens: 2048
          top-p: 0.9
          frequency-penalty: 0.0
          presence-penalty: 0.0

# 日誌配置
logging:
  level:
    io.github.aris0x145.papercraft: INFO
    org.springframework.ai: DEBUG
